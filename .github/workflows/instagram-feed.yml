name: Instagram to Discord

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests "git+https://github.com/instaloader/instaloader.git@refs/pull/2722/head"

      - name: Check Instagram
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python instagram_to_discord.py

      - name: Save latest Instagram post
        run: |
          if [ -f last_post.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_post.txt
            git diff --cached --quiet || git commit -m "Update latest Instagram post"
            git push
          fi
