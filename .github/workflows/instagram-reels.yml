name: Instagram Reels to Discord

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check-reels:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check Instagram Reels
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python instagram_reels_to_discord.py

      - name: Save latest Instagram Reel
        run: |
          if [ -f last_reel.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_reel.txt
            git diff --cached --quiet || git commit -m "Update latest Instagram Reel"
            git push
          fi
